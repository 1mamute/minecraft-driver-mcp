name: Build

# Runs `./gradlew build` (compile, unit tests, lint, jar) on Linux and Windows. It does not launch the game, so the
# runtime check in docs/contributing/testing.md stays manual. The Linux job uploads the mod jar as an artifact.
# Documentation-only changes skip it; the Documentation workflow checks those.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Caches the Gradle user home, including the Minecraft and Parchment files Loom downloads. Only pushes to main
      # write the cache; pull requests read it. The basic provider is the open-source one.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: minecraft-driver-mcp
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
          if-no-files-found: error
