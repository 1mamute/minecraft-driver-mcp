name: Release

# Keeps the release notes in step with `main` without committing to it. Every push to `main` rebuilds the notes from the
# commit history with scripts/changelog.mjs and stores them in a draft release tagged `unreleased`. Pushing a `v*` tag
# builds the jar and publishes a release whose body is the notes of that version, then deletes the draft.
# docs/release-notes.md is regenerated with `node scripts/changelog.mjs` in the release pull request.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The script reads every tag and the full history.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the notes
        run: node scripts/changelog.mjs --notes "$RUNNER_TEMP/notes.md"

      - name: Update the draft release
        if: github.ref_type == 'branch'
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "unreleased") | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@"$RUNNER_TEMP/notes.md" > /dev/null
          else
            gh release create unreleased --draft --title "Unreleased" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Check the tag matches mod_version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^mod_version *= *//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version in gradle.properties." >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        if: github.ref_type == 'tag'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: github.ref_type == 'tag'
        with:
          cache-provider: basic
      - name: Build the jar
        if: github.ref_type == 'tag'
        run: ./gradlew build
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $(ls versions/*/build/libs/*.jar | grep -v -- '-sources.jar')
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "unreleased") | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          fi
