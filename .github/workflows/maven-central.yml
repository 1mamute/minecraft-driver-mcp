name: Stage Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v<mod_version>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^mod_version *= *//p' gradle.properties)
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build and check publication
        run: ./gradlew build publishMavenPublicationToVerificationRepository
      - name: Check published artifacts
        run: node scripts/check-maven-publication.mjs
      - name: Stage signed artifacts for manual release in Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -PcentralPublishing=true
